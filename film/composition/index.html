<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Hot-Spots — film</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=block" rel="stylesheet" />
<style>
  /* Identite Hot-Spots « Terre vivante » : ivoire, vert foret, lagune, savane, feu ; espace pour l'ouverture et la fin. */
  :root {
    --bg: #f7f5ef; --surface: #ffffff; --surface-2: #eef3ec; --line: #dce3d8;
    --ink: #17251c; --ink-2: #3b4a40; --ink-3: #55645a;
    --forest: #123d28; --primary: #1f6b45; --leaf: #4fa36b; --lagoon: #0e7c86; --savanna: #e7c77a;
    --fire-2: #fdd27a; --fire-3: #f9a03f; --fire-4: #e8641e; --fire-5: #c2361a;
    --modis: #e4572e; --viirs: #2f7fd8; --noaa20: #13a08a;
    --space: #050b14; --space-2: #0b1a2c; --space-ink: #f2f6f3; --space-ink-2: #c9d6cf;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  body { font-family: "Geist", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--space); }
  .layer { position: absolute; inset: 0; pointer-events: none; will-change: transform, opacity; }
  .display { font-family: "Fraunces", Georgia, serif; font-weight: 600; letter-spacing: -0.015em; }
  .mono { font-family: "Geist Mono", ui-monospace, monospace; }
  img { display: block; }
  .clip { position: absolute; overflow: hidden; }
  .clip img { width: 100%; height: 100%; object-fit: cover; transform-origin: center; }
  .frame { position: absolute; border-radius: 22px; overflow: hidden; background: #fff;
    box-shadow: 0 2px 6px rgb(23 37 28 / 0.10), 0 40px 90px -20px rgb(23 37 28 / 0.38); }
  .frame::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px rgb(23 37 28 / 0.08); }
  .chip { position: absolute; display: inline-flex; align-items: center; gap: 12px; padding: 14px 24px; border-radius: 999px;
    background: rgb(255 255 255 / 0.9); border: 1px solid var(--line); color: var(--ink); font-size: 26px; font-weight: 500;
    box-shadow: 0 10px 30px -10px rgb(23 37 28 / 0.25); white-space: nowrap; }
  .chip i { width: 12px; height: 12px; border-radius: 99px; display: inline-block; }
  .kicker { font-size: 22px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; }
  .badge { position: absolute; padding: 8px 16px; border-radius: 999px; font-size: 20px; font-weight: 500;
    background: rgb(23 37 28 / 0.72); color: #fff; backdrop-filter: blur(6px); }
  pre.raw { position: absolute; font-family: "Geist Mono", monospace; font-size: 17px; line-height: 1.75; white-space: pre; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="film.js"></script>
</body>
</html>
